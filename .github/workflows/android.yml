
name: Build Mini Warriors Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y godot

      - name: Check project files
        run: |
          godot --version
          godot --headless --path . --editor --quit

      - name: Package project
        run: |
          mkdir -p build
          zip -j build/MiniWarriors-Project.zip project.godot main.tscn game.gd

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: MiniWarriors-Project
          path: build/MiniWarriors-Project.zip
          
