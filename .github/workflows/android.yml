
name: Build Mini Warriors Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Check project
        run: godot --headless --path . --editor --quit

      - name: Upload project files for next step
        uses: actions/upload-artifact@v4
        with:
          name: MiniWarriors-Project
          path: |
            project.godot
            main.tscn
            game.gd
            
